version: 2

models:
  - name: fct_eurusd_timeframes
    description: "Gold layer · OHLC + SMA + Williams fractals (3-bar and 5-bar) per (timeframe, candle_start). Composite key tested via tests/unique_timeframe_candle_start.sql. 5-bar ⊆ 3-bar invariant tested via tests/fractals_5bar_subset_of_3bar.sql"
    columns:
      - name: timeframe
        tests:
          - not_null
          - accepted_values:
              values: ['5m', '15m', '30m', '1h', '4h', '12h', '24h']

      - name: candle_start
        tests:
          - not_null

      - name: price_diff
        description: "Absolute difference between current close and previous close"

      - name: high_fractal_3
        description: "Bar's high is greater than ±1 immediate neighbours (3-bar Williams up-fractal)"
        tests:
          - not_null

      - name: high_fractal_5
        description: "Bar's high is greater than ±1 and ±2 neighbours (5-bar Williams up-fractal). Subset of high_fractal_3."
        tests:
          - not_null

      - name: low_fractal_3
        description: "Bar's low is less than ±1 immediate neighbours (3-bar Williams down-fractal)"
        tests:
          - not_null

      - name: low_fractal_5
        description: "Bar's low is less than ±1 and ±2 neighbours (5-bar Williams down-fractal). Subset of low_fractal_3."
        tests:
          - not_null

      - name: is_complete_5
        description: "TRUE when bar has full ±2 neighbours, so 5-bar verdict is final. FALSE for the latest 2 bars per timeframe."
        tests:
          - not_null

  - name: fct_eurusd_fvg
    description: "Fair Value Gaps (imbalances) identified across all timeframes. Each row = one FVG zone from candle_1.high/low gap to candle_3.low/high, with fill tracking over 30-day window."
    columns:
      - name: timeframe
        tests:
          - not_null
          - accepted_values:
              values: ['5m', '15m', '30m', '1h', '4h', '12h', '24h']

      - name: created_at
        description: "Timestamp of the middle candle (candle 2) that created the FVG"
        tests:
          - not_null

      - name: direction
        description: "bullish = gap up (prev_high < next_low), bearish = gap down (prev_low > next_high)"
        tests:
          - not_null
          - accepted_values:
              values: ['bullish', 'bearish']

      - name: fvg_low
        description: "Lower boundary of the FVG zone"
        tests:
          - not_null

      - name: fvg_high
        description: "Upper boundary of the FVG zone"
        tests:
          - not_null

      - name: fvg_size_pips
        description: "Size of FVG in pips (fvg_high - fvg_low) * 10000"
        tests:
          - not_null

      - name: status
        description: "open = untouched, partially_filled = price entered zone, fully_filled = price crossed entire zone"
        tests:
          - not_null
          - accepted_values:
              values: ['open', 'partially_filled', 'fully_filled']
